<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maven FX — Deriv Digit Analysis</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#071018;color:#eaf2f7}header{padding:18px 20px;border-bottom:1px solid #1b2b36;background:#0a151e;position:sticky;top:0;z-index:2}h1{margin:0;font-size:21px}main{max-width:1100px;margin:auto;padding:18px}.controls,.grid{display:grid;gap:12px}.controls{grid-template-columns:1fr 1fr auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}.card{background:#0d1a24;border:1px solid #1b303d;border-radius:14px;padding:15px}.wide{grid-column:1/-1}.label{font-size:11px;color:#89a1ae;text-transform:uppercase;letter-spacing:.08em}.value{font-size:24px;font-weight:800;margin-top:5px}select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #29414f;background:#0a151e;color:#eaf2f7}button{cursor:pointer}.signal{font-size:28px;font-weight:900}.digits{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}.digit{padding:8px 3px;text-align:center;background:#09141c;border-radius:8px}.digit b{display:block}.ticks{height:180px;overflow:auto;font-family:monospace;font-size:13px;line-height:1.7;color:#a9c1cc}.muted{color:#78909c;font-size:12px}@media(max-width:700px){.controls,.grid{grid-template-columns:1fr}.wide{grid-column:auto}.digits{grid-template-columns:repeat(5,1fr)}}</style></head><body><header><h1>Maven FX · Deriv Digit Analysis</h1><div class="muted">Live digit analysis only — no trading/account connection</div></header><main><section class="controls"><select id="market"><option value="">Loading markets…</option></select><select id="contract"><option value="over1">Over 1</option><option value="under8">Under 8</option><option value="over2">Over 2</option><option value="under7">Under 7</option></select><button id="reconnect">Reconnect</button></section><section class="grid"><div class="card wide"><div class="label">Final signal</div><div id="signal" class="signal">WAITING FOR DATA</div><div id="reason" class="muted">Collecting live ticks…</div></div><div class="card"><div class="label">Selected probability</div><div id="selected" class="value">—</div></div><div class="card"><div class="label">Comparison probability</div><div id="comparison" class="value">—</div></div><div class="card"><div class="label">Momentum</div><div id="momentum" class="value">—</div></div><div class="card"><div class="label">Trend</div><div id="trend" class="value">—</div></div><div class="card"><div class="label">Clustering</div><div id="cluster" class="value">—</div></div><div class="card"><div class="label">Transitioning</div><div id="transition" class="value">—</div></div><div class="card"><div class="label">Entry digit</div><div id="entry" class="value">—</div></div><div class="card wide"><div class="label">Digit probability</div><div id="digits" class="digits"></div></div><div class="card wide"><div class="label">Live last-digit stream</div><div id="ticks" class="ticks"></div></div></section></main><script>const WS='wss://ws.derivws.com/websockets/v3?app_id=1089';let ws=null,markets=[],symbol='',digits=[],max=200;const $=id=>document.getElementById(id);function log(x){$('ticks').innerHTML=x+'<br>'+$('ticks').innerHTML;if($('ticks').innerHTML.length>12000)$('ticks').innerHTML=$('ticks').innerHTML.slice(0,12000)}function lastDigit(q){const s=String(q);const p=s.indexOf('.');return +(p<0?s.at(-1):s.slice(p+1).at(-1)||'0')}function pct(n){return (n*100).toFixed(1)+'%'}function contract(){return $('contract').value}function compare(c){return c==='over1'?'under8':c==='under8'?'over1':c==='over2'?'under7':'over2'}function qualifies(d,c){if(c==='over1')return d>1;if(c==='under8')return d<8;if(c==='over2')return d>2;return d<7}function update(){if(digits.length<20)return;const counts=Array(10).fill(0);digits.forEach(d=>counts[d]++);const probs=counts.map(x=>x/digits.length);$('digits').innerHTML=probs.map((p,i)=>'<div class="digit"><b>'+i+'</b>'+pct(p)+'</div>').join('');const c=contract(),cmp=compare(c);const pSel=digits.filter(d=>qualifies(d,c)).length/digits.length,pCmp=digits.filter(d=>qualifies(d,cmp)).length/digits.length;$('selected').textContent=pct(pSel);$('comparison').textContent=pct(pCmp);const recent=digits.slice(-20);const first=recent.slice(0,10).filter(d=>qualifies(d,c)).length/10,last=recent.slice(-10).filter(d=>qualifies(d,c)).length/10;const m=last-first;$('momentum').textContent=m>.1?'BULLISH':m<-.1?'BEARISH':'NEUTRAL';const avg=recent.reduce((a,b)=>a+b,0)/recent.length;$('trend').textContent=avg>5.5?'HIGH DIGIT':avg<3.5?'LOW DIGIT':'BALANCED';const hits=counts.filter(x=>x>digits.length/10*1.2).length;$('cluster').textContent=hits?'ACTIVE':'BALANCED';const a=recent.at(-1),b=recent.at(-2);$('transition').textContent=a===b?'REPEATING':qualifies(a,c)?'FAVOURABLE':'MIXED';let entry=-1,best=-1;for(let i=0;i<10;i++){if(!counts[i])continue;const following=[];for(let j=0;j<digits.length-1;j++)if(digits[j]===i)following.push(digits[j+1]);if(following.length<3)continue;const score=following.filter(x=>qualifies(x,c)).length/following.length;if(score>best){best=score;entry=i}}$('entry').textContent=entry<0?'—':entry+' ('+pct(best)+')';let signal='WAIT',reason='Signals are mixed';if(pSel>.55&&pSel>pCmp+0.08&&m>.05){signal=c.toUpperCase();reason='Probability, comparison gate and recent momentum align'}else if(pCmp>pSel){signal='BLOCKED';reason='Comparison contract currently has stronger observed probability'}$('signal').textContent=signal;$('reason').textContent=reason}function subscribe(){if(!ws||ws.readyState!==1||!symbol)return;ws.send(JSON.stringify({ticks:symbol,subscribe:1}))}function connect(){if(ws)try{ws.close()}catch(e){}ws=new WebSocket(WS);ws.onopen=()=>{ws.send(JSON.stringify({active_symbols:'brief',product_type:'basic'}))};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.msg_type==='active_symbols'){markets=m.active_symbols.filter(x=>x.is_trading===1&&/^(R_|1HZ|JD)/.test(x.symbol));$('market').innerHTML=markets.map(x=>'<option value="'+x.symbol+'">'+x.display_name+'</option>').join('');symbol=$('market').value;subscribe()}if(m.msg_type==='tick'&&m.tick){const d=lastDigit(m.tick.quote);digits.push(d);if(digits.length>max)digits.shift();log(d);update()}};ws.onclose=()=>log('WebSocket closed — press Reconnect') ;ws.onerror=()=>log('WebSocket error')}$('market').onchange=()=>{symbol=$('market').value;digits=[];subscribe()};$('contract').onchange=update;$('reconnect').onclick=connect;connect();</script></body></html>
